services:

  # ------------------------------------------------------------ #
  # ------- Identity and Access Management (IAM) Service ------- #
  # ------------------------------------------------------------ #
  keycloakweb:
    image: quay.io/keycloak/keycloak:nightly
    container_name: keycloakweb
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloakdb:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password

      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 8080
      KC_HOSTNAME_STRICT: false
      KC_HOSTNAME_STRICT_HTTPS: false

      KC_LOG_LEVEL: info
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    command: start-dev
    depends_on:
      - keycloakdb
    ports:
      - 8080:8080

  keycloakdb:
    image: postgres:16.3
    container_name: keycloakdb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password

  # ------------------------------------------------------------ #
  # --------------------- pgAdmin Service ---------------------- #
  # ------------------------------------------------------------ #
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - keycloakdb

  # ------------------------------------------------------------ #
  # ---------------------- Micro Service ----------------------- #
  # ------------------------------------------------------------ #
  micro.service:
    container_name: micro.service
    build:
      context: ../../spacetimewave.services/spacetimewave.micro.service/src
      dockerfile: ../../spacetimewave.services/spacetimewave.micro.service/src/Dockerfile
    ports:
      - "8443:443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Local
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://dashboard:18889
      - OTEL_RESOURCE_ATTRIBUTES=service.name=API.Service
    networks:
      - otel
    # depends_on:
    #   - db

  # ------------------------------------------------------------ #
  # ---------------- Open Telemetry Dashboard ------------------ #
  # ------------------------------------------------------------ #
  dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:13
    container_name: dashboard
    ports:
    - "18888:18888"
    environment:
    - ASPNETCORE_UI_CULTURE=en-US
    - ASPNETCORE_CULTURE=en-US
    networks:
    - otel

networks:
  otel:

volumes:
  postgres_data:

